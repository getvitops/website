# Deploys the `dev` branch to the isolated dev worker (vitops-dev @ dev.vitops.ca).
# Claude Code remote works off `dev`; every push here refreshes the review site.
#
# Required repo secrets:
#   CLOUDFLARE_API_TOKEN   — token with Workers + D1 + R2 edit on this account
#   CLOUDFLARE_ACCOUNT_ID  — the Cloudflare account id
#   VITOPS_DEV_D1_ID       — id from `wrangler d1 create vitops-dev`
#                            (without it the build script hard-fails, on purpose)
name: Deploy dev

on:
  push:
    branches: [dev]

permissions:
  contents: read

concurrency:
  group: deploy-dev
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - uses: actions/checkout@v4
        with:
          # scripts/sitemap.mjs stamps <lastmod> from `git log`. The default
          # shallow clone has one commit, so every page would claim the deploy
          # date — plausible-looking and wrong.
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build + deploy dev worker
        run: pnpm run deploy:dev
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          VITOPS_DEV_D1_ID: ${{ secrets.VITOPS_DEV_D1_ID }}
