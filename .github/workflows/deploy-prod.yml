# Deploys `main` to production (vitops @ vitops.ca).
# `main` is branch-protected — it only advances via the Promote workflow, so a
# push here always represents approved, promoted code.
#
# Required repo secrets:
#   CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID
#   VITOPS_GSC_SERVICE_ACCOUNT — Google service-account JSON with Search Console
#     access to sc-domain:vitops.ca. A service account rather than the user OAuth
#     refresh token `vitops search setup` uses: this runs on every deploy, and a
#     refresh token for an OAuth client still in Testing expires after 7 days.
name: Deploy prod

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          # scripts/sitemap.mjs stamps <lastmod> from `git log`. The default
          # shallow clone has one commit, so every page would claim the deploy
          # date — plausible-looking and wrong, and `vitops search notify` diffs
          # on exactly that field to decide what to resubmit.
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build + deploy prod worker
        run: pnpm run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # `search notify` diffs the deployed sitemap against the previous run's
      # snapshot in `.vitops/` and resubmits only what moved. Without the cache
      # every run looks cold and resubmits the whole site.
      - name: Restore indexing snapshot
        uses: actions/cache@v4
        with:
          path: .vitops
          key: vitops-indexing-${{ github.run_id }}
          restore-keys: vitops-indexing-

      # Non-fatal by design: the deploy above already succeeded, and a search
      # engine that wasn't told about it is a delay, not an outage.
      - name: Notify search engines
        continue-on-error: true
        run: npx vitops search notify -i site.json
        env:
          VITOPS_GSC_SERVICE_ACCOUNT: ${{ secrets.VITOPS_GSC_SERVICE_ACCOUNT }}
